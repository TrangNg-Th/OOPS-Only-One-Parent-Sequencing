name: oops
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - bcftools>=1.17
  - samtools>=1.17
  - tabix
  - whatshap  ## May be removed in the future, but currently used for phasing
  - pandas >=2.2,<2.3   ## pinned: pandas changed GroupBy.apply grouping-column
                        ## behavior across releases; callable_genome.py now uses
                        ## GroupBy.sample and is version-robust, but pin for
                        ## reproducible builds.
  - numpy >=1.26,<2.3
  - scipy
  - matplotlib-base
  - pysam
  - awscli
  - wget
