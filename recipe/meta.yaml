{% set version = "0.2.0" %}

package:
  name: oops-dnm
  version: {{ version }}

source:
  # Build from the repo this recipe lives in (one level up).
  path: ..

build:
  number: 0    ## reset to 0 on every version bump; increment only for rebuilds
               ## of the SAME version (e.g. recipe-only changes)
  noarch: generic ## conda-build auto-detects and runs build.sh by filename alone

requirements:
  run:
    - python >=3.12
    - bcftools >=1.17
    - samtools >=1.17
    - tabix
    - whatshap
    - pandas >=2.2,<2.3   # pinned: pandas changed GroupBy.apply grouping-column
                          # behavior across releases (callable_genome.py now uses
                          # GroupBy.sample and is version-robust; pin for repro).
    - numpy >=1.26,<2.3
    - scipy
    - matplotlib-base
    - pysam
    - awscli
    - wget

test:
  commands:
    # Smoke tests only -- the real pipeline needs a Slurm cluster, real
    # BAMs/VCFs, and project directories, so we don't try to *run* it here.
    - test -x "${PREFIX}/bin/oops"
    - bash -n "${PREFIX}/share/oops/main.sh"
    - python -c "import pandas, numpy, scipy, pysam, matplotlib"

about:
  home: https://github.com/TrangNg-Th/OOPS-Only-One-Parent-Sequencing
  summary: >
    Estimate germline de novo mutation (DNM) rates from a duo with one parent has sequencing data.
  description: |
    OOPS (Only One Parent Sequencing) phases a child's long reads into two
    haplotypes, compares each haplotype against the one sequenced parent's
    genotypes, and flags haplotype single mismatch as de novo mutation
    candidate. Candidates are validated against long reads and weighed
    against a callable-genome estimate to produce a mutation rate.
    Requires a Slurm cluster.
  license: MIT
  license_file: LICENSE

